<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="OU x CHAOS Industries Collaboration Capstone">
  <defs>
    <clipPath id="roundedCorners"><rect width="1200" height="320" rx="24" ry="24"/></clipPath>
    <radialGradient id="bgGlow" cx="16%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#841617" stop-opacity="0.28">
        <animate attributeName="stop-opacity" values="0.28;0.45;0.28" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b0b0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0392b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#841617" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#841617">
        <animate attributeName="stop-color" values="#841617;#f5f5f5;#841617" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f5f5f5">
        <animate attributeName="stop-color" values="#f5f5f5;#841617;#f5f5f5" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <g clip-path="url(#roundedCorners)">
  <rect width="1200" height="320" fill="#0b0b0d"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#bgGlow)"/>

  <!-- radar -->
  <g transform="translate(180,160)">
    <circle r="115" fill="none" stroke="#841617" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="80" fill="none" stroke="#841617" stroke-opacity="0.25" stroke-width="1"/>
    <circle r="45" fill="none" stroke="#841617" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="-115" y1="0" x2="115" y2="0" stroke="#841617" stroke-opacity="0.15"/>
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#841617" stroke-opacity="0.15"/>
    <circle r="4" fill="#e6e6e6">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- rotating sweep -->
    <g>
      <path d="M 0 0 L 115 0 A 115 115 0 0 0 100 -57 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="115" y2="0" stroke="#e05252" stroke-width="2">
        <animate attributeName="stroke" values="#e05252;#841617;#e05252" dur="4s" repeatCount="indefinite"/>
      </line>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>
    <!-- contacts -->
    <circle cx="70" cy="-45" r="4" fill="#ff6b5e">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.12;0.3;1" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-55" cy="60" r="4" fill="#ff6b5e">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.12;0.3;1" dur="4s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="95" r="3" fill="#ff6b5e">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.12;0.3;1" dur="4s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-90" cy="-35" r="3" fill="#ff6b5e">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.12;0.3;1" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title block -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="700" y="128" font-size="64" font-weight="800" letter-spacing="4" fill="url(#titleGrad)">OU &#215; CHAOS</text>
    <text x="700" y="172" font-size="19" font-weight="600" letter-spacing="10" fill="#cfcfcf">COLLABORATION CAPSTONE</text>
    <text x="700" y="200" font-size="14" letter-spacing="3" fill="#8b8b8b">UNIVERSITY OF OKLAHOMA &#183; CHAOS INDUSTRIES &#183; MONOREPO</text>

    <!-- typed tagline -->
    <g font-family="Consolas, Menlo, monospace" font-size="17" text-anchor="middle">
      <text x="700" y="252" fill="#ff9a8f">
        <tspan opacity="0">&gt; <set attributeName="opacity" to="1" begin="0.3s" fill="freeze"/></tspan><tspan opacity="0">c<set attributeName="opacity" to="1" begin="0.5s" fill="freeze"/></tspan><tspan opacity="0">r<set attributeName="opacity" to="1" begin="0.65s" fill="freeze"/></tspan><tspan opacity="0">e<set attributeName="opacity" to="1" begin="0.8s" fill="freeze"/></tspan><tspan opacity="0">a<set attributeName="opacity" to="1" begin="0.95s" fill="freeze"/></tspan><tspan opacity="0">t<set attributeName="opacity" to="1" begin="1.1s" fill="freeze"/></tspan><tspan opacity="0">i<set attributeName="opacity" to="1" begin="1.25s" fill="freeze"/></tspan><tspan opacity="0">n<set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/></tspan><tspan opacity="0">g<set attributeName="opacity" to="1" begin="1.55s" fill="freeze"/></tspan><tspan opacity="0"> <set attributeName="opacity" to="1" begin="1.7s" fill="freeze"/></tspan><tspan opacity="0">t<set attributeName="opacity" to="1" begin="1.85s" fill="freeze"/></tspan><tspan opacity="0">h<set attributeName="opacity" to="1" begin="2s" fill="freeze"/></tspan><tspan opacity="0">e<set attributeName="opacity" to="1" begin="2.15s" fill="freeze"/></tspan><tspan opacity="0"> <set attributeName="opacity" to="1" begin="2.3s" fill="freeze"/></tspan><tspan opacity="0">t<set attributeName="opacity" to="1" begin="2.45s" fill="freeze"/></tspan><tspan opacity="0">i<set attributeName="opacity" to="1" begin="2.6s" fill="freeze"/></tspan><tspan opacity="0">m<set attributeName="opacity" to="1" begin="2.75s" fill="freeze"/></tspan><tspan opacity="0">e<set attributeName="opacity" to="1" begin="2.95s" fill="freeze"/></tspan><tspan opacity="0"> <set attributeName="opacity" to="1" begin="3.1s" fill="freeze"/></tspan><tspan opacity="0">t<set attributeName="opacity" to="1" begin="3.25s" fill="freeze"/></tspan><tspan opacity="0">o<set attributeName="opacity" to="1" begin="3.4s" fill="freeze"/></tspan><tspan opacity="0"> <set attributeName="opacity" to="1" begin="3.55s" fill="freeze"/></tspan><tspan opacity="0">c<set attributeName="opacity" to="1" begin="3.7s" fill="freeze"/></tspan><tspan opacity="0">h<set attributeName="opacity" to="1" begin="3.85s" fill="freeze"/></tspan><tspan opacity="0">a<set attributeName="opacity" to="1" begin="4s" fill="freeze"/></tspan><tspan opacity="0">n<set attributeName="opacity" to="1" begin="4.15s" fill="freeze"/></tspan><tspan opacity="0">g<set attributeName="opacity" to="1" begin="4.3s" fill="freeze"/></tspan><tspan opacity="0">e<set attributeName="opacity" to="1" begin="4.45s" fill="freeze"/></tspan><tspan opacity="0"> <set attributeName="opacity" to="1" begin="4.6s" fill="freeze"/></tspan><tspan opacity="0">t<set attributeName="opacity" to="1" begin="4.75s" fill="freeze"/></tspan><tspan opacity="0">h<set attributeName="opacity" to="1" begin="4.9s" fill="freeze"/></tspan><tspan opacity="0">e<set attributeName="opacity" to="1" begin="5.05s" fill="freeze"/></tspan><tspan opacity="0"> <set attributeName="opacity" to="1" begin="5.2s" fill="freeze"/></tspan><tspan opacity="0">o<set attributeName="opacity" to="1" begin="5.35s" fill="freeze"/></tspan><tspan opacity="0">u<set attributeName="opacity" to="1" begin="5.5s" fill="freeze"/></tspan><tspan opacity="0">t<set attributeName="opacity" to="1" begin="5.65s" fill="freeze"/></tspan><tspan opacity="0">c<set attributeName="opacity" to="1" begin="5.8s" fill="freeze"/></tspan><tspan opacity="0">o<set attributeName="opacity" to="1" begin="5.95s" fill="freeze"/></tspan><tspan opacity="0">m<set attributeName="opacity" to="1" begin="6.1s" fill="freeze"/></tspan><tspan opacity="0">e<set attributeName="opacity" to="1" begin="6.25s" fill="freeze"/></tspan><tspan opacity="0">.<set attributeName="opacity" to="1" begin="6.4s" fill="freeze"/></tspan><tspan opacity="0">_<set attributeName="opacity" to="1" begin="6.55s" fill="freeze"/></tspan>
      </text>
    </g>
  </g>

  <!-- scanline sweep -->
  <rect x="-300" y="0" width="300" height="320" fill="url(#scan)">
    <animate attributeName="x" values="-300;1200" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom accent line -->
  <rect x="0" y="316" width="1200" height="4" fill="#841617">
    <animate attributeName="opacity" values="1;0.45;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  </g>
</svg>
