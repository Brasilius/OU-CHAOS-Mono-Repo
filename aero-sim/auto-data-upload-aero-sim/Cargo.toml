[package]
name = "auto-data-upload-aero-sim"
version = "0.1.0"
edition = "2024"
description = "Aero Archive: a terminal mission control for simulation data"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "aero-archive"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
directories = "6"
ratatui = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
